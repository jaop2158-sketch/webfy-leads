<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robô Multi-Nicho Google Maps | Webfy Prospecção Live</title>
    <meta name="description" content="Gerador inteligente de pesquisas no Google Maps e prompts customizados de ligação para qualquer nicho e cidade.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #dc2626;
            --primary-hover: #b91c1c;
            --accent: #facc15;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --emerald: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.5;
            padding: 16px;
            padding-bottom: 50px;
            min-height: 100vh;
        }

        .header-box {
            text-align: center;
            padding: 20px 12px;
            background: linear-gradient(135deg, rgba(220,38,38,0.25), rgba(250,204,21,0.15));
            border: 1px solid rgba(220,38,38,0.4);
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .header-box h1 { font-size: 22px; font-weight: 800; color: #ffffff; }
        .header-box p { font-size: 13px; color: var(--accent); font-weight: 700; margin-top: 4px; }

        .control-card {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }

        input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
        }

        input:focus { border-color: var(--primary); }

        .btn-live-search {
            width: 100%;
            background: linear-gradient(135deg, #4285F4, #1a73e8);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(66, 133, 244, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            margin-bottom: 12px;
        }

        .btn-generate-prompts {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #eab308);
            color: #000000;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(250, 204, 21, 0.3);
        }

        .output-card {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .output-card h3 { font-size: 17px; font-weight: 800; color: var(--accent); margin-bottom: 12px; }

        .prompt-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px;
            font-size: 13.5px;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 15px;
        }
        .prompt-box strong { color: #ffffff; }

        .btn-whatsapp-builder {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.4);
            margin-top: 10px;
        }

        .btn-action-wa {
            background: #25D366;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            text-align: center;
            display: block;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>🤖 Robô Multi-Nicho Google Maps</h1>
        <p>Busca ao Vivo & Prompts de Ligação Gerados na Hora</p>
    </div>

    <!-- CAMPO LIVRE DE CIDADE E NICHO -->
    <div class="control-card">
        <div class="form-group">
            <label>1. Digite o Nicho (Livre):</label>
            <input type="text" id="nicheInput" value="Oficina Mecânica" placeholder="Ex: Oficina Mecânica, Barbearia, Hamburgueria, Odontologia, Pet Shop">
        </div>

        <div class="form-group">
            <label>2. Digite a Cidade (Livre):</label>
            <input type="text" id="cityInput" value="Santo André SP" placeholder="Ex: Santo André SP, Campinas SP, Sorocaba SP, Pouso Alegre MG">
        </div>

        <button onclick="executeGoogleSearch()" class="btn-live-search">
            📍 Buscar no Google Maps ao Vivo
        </button>

        <button onclick="generateCustomPrompts()" class="btn-generate-prompts">
            ⚡ Gerar Prompts de Ligação para este Nicho
        </button>
    </div>

    <!-- PROMPTS CUSTOMIZADOS GERADOS DINAMICAMENTE -->
    <div id="outputPrompts" class="output-card">
        <h3 id="promptTitle">📞 Prompt de Ligação Gerado:</h3>
        
        <div class="prompt-box" id="callScriptBox"></div>

        <h3>💬 Mensagem de WhatsApp Gerada:</h3>
        <div class="prompt-box" id="waScriptBox"></div>
    </div>

    <!-- GERADOR DE PITCH DIRETO PARA O LEAD ACHADO NO GOOGLE -->
    <div class="control-card">
        <div class="form-group">
            <label>⚡ Enviar Proposta para o Lead Achado no Google:</label>
            <input type="text" id="leadName" placeholder="Nome do Estabelecimento (Ex: Oficina DAF)">
        </div>

        <div class="form-group">
            <input type="tel" id="leadPhone" placeholder="WhatsApp do Lead (Ex: 11968066402)">
        </div>

        <button onclick="generatePitch()" class="btn-whatsapp-builder">
            🚀 Gerar Conversa 1-Clique no WhatsApp
        </button>

        <div id="pitchResult" style="display: none; margin-top: 15px;" class="prompt-box">
            <h4 style="color: var(--accent); font-weight: 800; margin-bottom: 6px;">✅ Mensagem Pronta:</h4>
            <p id="pitchPreviewText" style="font-size: 13px; color: #cbd5e1; margin-bottom: 10px;"></p>
            <a id="pitchWaBtn" href="#" target="_blank" class="btn-action-wa">
                💬 Disparar no WhatsApp do Lead
            </a>
        </div>
    </div>

    <script>
        function executeGoogleSearch() {
            const niche = document.getElementById('nicheInput').value.trim();
            const city = document.getElementById('cityInput').value.trim();

            if(!niche || !city) {
                alert("Por favor, preencha o nicho e a cidade!");
                return;
            }

            const query = encodeURIComponent(`${niche} em ${city}`);
            const googleMapsUrl = `https://www.google.com/maps/search/${query}`;

            window.open(googleMapsUrl, '_blank');
        }

        function generateCustomPrompts() {
            const niche = document.getElementById('nicheInput').value.trim() || 'estabelecimento';
            const city = document.getElementById('cityInput').value.trim() || 'sua região';

            document.getElementById('promptTitle').innerText = `📞 Roteiro de Ligação para ${niche} em ${city}:`;

            document.getElementById('callScriptBox').innerHTML = `
                <strong>[Abertura Amigável]:</strong><br>
                <em>"Fala, [Nome do Dono]! Tudo bem? Aqui é o João!<br>
                Cara, tava pesquisando os melhores lugares de <strong>${niche}</strong> aqui em <strong>${city}</strong> no Google Maps e vi a nota excelente de vocês! Parabéns pelo atendimento!<br><br>
                Eu sou especialista em presença digital para <strong>${niche}</strong> e montei uma prévia gratuita de um site moderno pra vocês.<br>
                Não tô te vendendo nada agora, só queria te mandar o link no WhatsApp pra você dar uma olhada no celular. Posso te mandar nesse número mesmo?"</em>
            `;

            document.getElementById('waScriptBox').innerHTML = `
                <em>"Fala, pessoal da [Nome da empresa]! Tudo bem? Aqui é o João!<br><br>
                Dando uma olhada na excelente reputação de vocês como <strong>${niche}</strong> em <strong>${city}</strong> no Google Maps, montei uma prévia exclusiva de um site moderno no celular:<br><br>
                👉 Acesse a prévia: https://webfy-leads.vercel.app/oficina_dois_amigos.html<br><br>
                Dá uma olhada no celular e me diz o que acharam! Se quiserem ajustar qualquer detalhe, mudo na hora pra vocês!"</em>
            `;

            document.getElementById('outputPrompts').style.display = 'block';
            window.scrollTo({ top: 400, behavior: 'smooth' });
        }

        function generatePitch() {
            const niche = document.getElementById('nicheInput').value.trim() || 'estabelecimento';
            const city = document.getElementById('cityInput').value.trim() || 'região';
            const name = document.getElementById('leadName').value.trim() || 'Cliente';
            let phone = document.getElementById('leadPhone').value.replace(/\D/g, '');

            if (!phone) {
                alert("Por favor, digite o WhatsApp do lead!");
                return;
            }

            if (!phone.startsWith('55') && phone.length <= 11) {
                phone = '55' + phone;
            }

            const pitchText = `Fala, pessoal da ${name}! Tudo bem? Aqui é o João!\n\nEstava vendo as avaliações no Google Maps de ${niche} em ${city} e montei uma prévia exclusiva de um site moderno no celular para vocês:\n\n👉 Acesse a prévia no celular: https://webfy-leads.vercel.app/oficina_dois_amigos.html\n\nDá uma olhada sem compromisso e me diz o que acharam! Se quiserem mudar fotos ou textos, ajusto na hora para vocês!`;

            const waLink = `https://wa.me/${phone}?text=${encodeURIComponent(pitchText)}`;

            document.getElementById('pitchPreviewText').innerText = `Proposta formatada para: ${name} (${phone})`;
            document.getElementById('pitchWaBtn').href = waLink;
            document.getElementById('pitchResult').style.display = 'block';
        }
    </script>

</body>
</html>
