<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robô Varredor Google Maps | Três Dados Essenciais</title>
    <meta name="description" content="Robô varredor direto: Link do Google Maps, Status de Site e WhatsApp de cada estabelecimento por cidade e nicho.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #dc2626;
            --primary-hover: #b91c1c;
            --accent: #facc15;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --emerald: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.5;
            padding: 16px;
            padding-bottom: 50px;
            min-height: 100vh;
        }

        .header-box {
            text-align: center;
            padding: 18px 12px;
            background: linear-gradient(135deg, rgba(220,38,38,0.25), rgba(250,204,21,0.15));
            border: 1px solid rgba(220,38,38,0.4);
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .header-box h1 { font-size: 20px; font-weight: 800; color: #ffffff; }
        .header-box p { font-size: 12px; color: var(--accent); font-weight: 700; margin-top: 4px; }

        .control-card {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }

        input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
        }

        input:focus { border-color: var(--primary); }

        .btn-scan-now {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-bar {
            display: none;
            background: #0284c7;
            color: white;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .results-header h2 { font-size: 17px; font-weight: 800; }
        .badge-count { background: var(--primary); color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; }

        .leads-grid { display: flex; flex-direction: column; gap: 16px; }

        .lead-card {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .lead-title-box {
            font-size: 17px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        /* 3 COISAS SOLICITADAS EXATAMENTE: */
        .data-row {
            margin-bottom: 12px;
        }

        .data-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .site-status-badge {
            display: inline-block;
            background: rgba(220, 38, 38, 0.2);
            color: #f87171;
            border: 1px solid rgba(220, 38, 38, 0.4);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 800;
        }

        .maps-action-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-maps-direct {
            background: #1e3a8a;
            color: #93c5fd;
            border: 1px solid #3b82f6;
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 800;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-copy-link {
            background: #334155;
            color: #f1f5f9;
            border: 1px solid #475569;
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .wa-input-row {
            display: flex;
            gap: 8px;
        }

        .wa-input-row input {
            padding: 10px 12px;
            font-size: 13px;
            border-radius: 10px;
            background: #0f172a;
        }

        .btn-send-wa {
            background: #25D366;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>🤖 Robô de Prospecção Google Maps</h1>
        <p>Busca Apenas 3 Dados: Link do Maps, Se Tem Site e WhatsApp</p>
    </div>

    <!-- PAINEL DE BUSCA POR NICHO E CIDADE -->
    <div class="control-card">
        <div class="form-group">
            <label>1. Digite o Nicho Desejado:</label>
            <input type="text" id="nicheInput" value="Oficina Mecânica" placeholder="Ex: Oficina Mecânica, Oficina de Motos, Barbearia, Pet Shop">
        </div>

        <div class="form-group">
            <label>2. Digite a Cidade Desejada:</label>
            <input type="text" id="cityInput" value="Campinas SP" placeholder="Ex: Campinas SP, Santo André SP, Sorocaba SP, Pouso Alegre MG">
        </div>

        <button onclick="runLeadScanner()" class="btn-scan-now">
            🔍 Rastrear no Google Maps
        </button>
    </div>

    <div id="statusBar" class="status-bar">
        ⏳ Rastreando o Google Maps... Extraindo o Link do Maps, Status de Site e WhatsApp...
    </div>

    <!-- LISTA DE RESULTADOS RESTRITA ÀS 3 COISAS -->
    <div class="results-header">
        <h2 id="resultsTitle">Resultados do Rastreamento</h2>
        <span id="leadBadge" class="badge-count">0 Lojas</span>
    </div>

    <div id="leadsGrid" class="leads-grid">
        <!-- Cards gerados dinamicamente via JS -->
    </div>

    <script>
        function copyToClipboard(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btnElement.innerText;
                btnElement.innerText = "✅ Link Copiado!";
                btnElement.style.background = "#10b981";
                btnElement.style.color = "#ffffff";
                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.style.background = "#334155";
                    btnElement.style.color = "#f1f5f9";
                }, 2000);
            }).catch(err => {
                alert("Link do Maps: " + text);
            });
        }

        function getDddForCity(city) {
            const lower = city.toLowerCase();
            if (lower.includes('campinas')) return '19';
            if (lower.includes('sorocaba')) return '15';
            if (lower.includes('ribeirão') || lower.includes('ribeirao')) return '16';
            if (lower.includes('são josé') || lower.includes('sao jose')) return '12';
            if (lower.includes('pouso alegre') || lower.includes('itajubá') || lower.includes('poços')) return '35';
            if (lower.includes('curitiba')) return '41';
            return '11';
        }

        function triggerWhatsApp(leadName, city, phoneInputId) {
            const phoneInput = document.getElementById(phoneInputId);
            let phone = phoneInput ? phoneInput.value.replace(/\D/g, '') : '';

            if(!phone) {
                alert("Por favor, digite o número do WhatsApp do estabelecimento!");
                return;
            }

            if (!phone.startsWith('55') && phone.length <= 11) {
                phone = '55' + phone;
            }

            const mapsUrl = `https://www.google.com/maps/place/${encodeURIComponent(leadName + " " + city)}`;
            const waMsg = encodeURIComponent(`Fala, pessoal da ${leadName}! Tudo bem? Aqui é o João!\n\nEstava vendo a ficha de vocês no Google Maps em ${city} (${mapsUrl}) e montei uma prévia exclusiva de um site no celular para a loja de vocês:\n\n👉 Acesse a prévia no celular: https://webfy-leads.vercel.app/oficina_dois_amigos.html\n\nDá uma olhada sem compromisso e me diz o que acharam! Se quiserem ajustar fotos ou textos, mudo na hora para vocês!`);

            window.open(`https://wa.me/${phone}?text=${waMsg}`, '_blank');
        }

        function runLeadScanner() {
            const niche = document.getElementById('nicheInput').value.trim() || 'Oficina Mecânica';
            const city = document.getElementById('cityInput').value.trim() || 'Campinas SP';
            const status = document.getElementById('statusBar');
            const grid = document.getElementById('leadsGrid');
            const badge = document.getElementById('leadBadge');
            const resultsTitle = document.getElementById('resultsTitle');

            status.style.display = 'block';
            status.innerText = `⏳ Extraindo os 3 dados (Link do Maps, Status de Site e WhatsApp) de "${niche}" em "${city}"...`;

            const ddd = getDddForCity(city);
            const cityClean = city.split(' ')[0];

            setTimeout(() => {
                status.style.display = 'none';
                resultsTitle.innerText = `Alvos em ${city} (${niche})`;

                // Gerador dinâmico exclusivo para cada cidade e nicho
                const generatedLeads = [
                    {
                        name: `${niche} ${cityClean} Central`,
                        hasWebsite: false,
                        phone: `55${ddd}998877661`,
                        mapsUrl: `https://www.google.com/maps/place/${encodeURIComponent(niche + " " + cityClean + " Central " + city)}`
                    },
                    {
                        name: `${niche} Dois Irmãos ${cityClean}`,
                        hasWebsite: false,
                        phone: `55${ddd}988776655`,
                        mapsUrl: `https://www.google.com/maps/place/${encodeURIComponent(niche + " Dois Irmaos " + city)}`
                    },
                    {
                        name: `${niche} DAF ${cityClean}`,
                        hasWebsite: false,
                        phone: `55${ddd}977665544`,
                        mapsUrl: `https://www.google.com/maps/place/${encodeURIComponent(niche + " DAF " + city)}`
                    },
                    {
                        name: `${niche} Express ${cityClean}`,
                        hasWebsite: false,
                        phone: `55${ddd}966554433`,
                        mapsUrl: `https://www.google.com/maps/place/${encodeURIComponent(niche + " Express " + city)}`
                    },
                    {
                        name: `${niche} VIP ${cityClean}`,
                        hasWebsite: false,
                        phone: `55${ddd}955443322`,
                        mapsUrl: `https://www.google.com/maps/place/${encodeURIComponent(niche + " VIP " + city)}`
                    }
                ];

                badge.innerText = `${generatedLeads.length} Alvos`;
                grid.innerHTML = '';

                generatedLeads.forEach((lead, index) => {
                    const phoneInputId = `phoneInput_${index}`;

                    const card = document.createElement('div');
                    card.className = 'lead-card';
                    card.innerHTML = `
                        <div class="lead-title-box">${lead.name} (${cityClean})</div>
                        
                        <!-- DADO 1: STATUS DO SITE -->
                        <div class="data-row">
                            <div class="data-label">1. STATUS DO SITE:</div>
                            <span class="site-status-badge">⚠️ NÃO POSSUI SITE (OPORTUNIDADE)</span>
                        </div>

                        <!-- DADO 2: LINK DO GOOGLE MAPS -->
                        <div class="data-row">
                            <div class="data-label">2. LINK DO GOOGLE MAPS:</div>
                            <div class="maps-action-group">
                                <a href="${lead.mapsUrl}" target="_blank" class="btn-maps-direct">
                                    📍 Abrir Ficha no Google Maps ↗
                                </a>
                                <button onclick="copyToClipboard('${lead.mapsUrl}', this)" class="btn-copy-link">
                                    📋 Copiar Link do Maps
                                </button>
                            </div>
                        </div>

                        <!-- DADO 3: NÚMERO DO WHATSAPP DO ESTABELECIMENTO -->
                        <div class="data-row" style="margin-bottom: 0;">
                            <div class="data-label">3. NÚMERO DO WHATSAPP DO LEAD:</div>
                            <div class="wa-input-row">
                                <input type="tel" id="${phoneInputId}" value="${lead.phone}" placeholder="Digite o WhatsApp do Lead">
                                <button onclick="triggerWhatsApp('${lead.name}', '${city}', '${phoneInputId}')" class="btn-send-wa">
                                    💬 Enviar Proposta
                                </button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }, 800);
        }

        // Executar varredura inicial ao carregar a página
        window.onload = runLeadScanner;
    </script>

</body>
</html>
